<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>动态明信片</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;font-family:var(--font-cap)}

:root{
  --font-intro:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --font-msg:"Kaiti SC","STKaiti","KaiTi","楷体",cursive;
  --font-cap:"PingFang SC",system-ui,sans-serif;
  --font-addr:Georgia,"Times New Roman",serif;
  --font-pm:Georgia,serif;
}

/* 背景 */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  filter:blur(9px);transform:scale(1.09);will-change:opacity}
.bg img,.bg svg{display:block;width:100%;height:100%;object-fit:cover}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;will-change:opacity;
  background:radial-gradient(ellipse at 50% 46%,transparent 28%,rgba(4,3,12,.84) 100%)}

/* 开场 */
.intro{position:fixed;inset:0;z-index:4;pointer-events:none;will-change:transform,opacity;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.9em;padding:0 8vw;text-align:center}
.intro p{margin:0;font-family:var(--font-intro);font-size:clamp(19px,4.2vw,40px);line-height:1.7;
  letter-spacing:.34em;text-indent:.34em;color:rgba(255,255,255,.93);
  text-shadow:0 0 34px rgba(255,200,140,.35),0 2px 22px rgba(0,0,0,.65);
  opacity:0;animation:lineIn 1.1s cubic-bezier(.2,.8,.3,1) forwards}
.intro p:nth-child(2){animation-delay:.62s}
.intro p:nth-child(3){animation-delay:.99s}
@keyframes lineIn{to{opacity:1}}
.cue{margin-top:3.4em;font-size:clamp(10px,1.45vw,12px);letter-spacing:.42em;text-indent:.42em;
  color:rgba(255,255,255,.55);opacity:0;
  animation:cueIn 1s ease 1.8s forwards,cueBreathe 2.6s ease-in-out 2.8s infinite}
@keyframes cueIn{to{opacity:1}}
@keyframes cueBreathe{0%,100%{opacity:.34;transform:translateY(0)}50%{opacity:.95;transform:translateY(5px)}}

/* 舞台 */
.stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  contain:strict;touch-action:none}
.card-rise{perspective:1700px;perspective-origin:50% 50%;opacity:0;will-change:transform,opacity}
.tilt{transform-style:preserve-3d;will-change:transform}
.flip{position:relative;width:min(86vw,640px);aspect-ratio:640/410;
  transform-style:preserve-3d;will-change:transform}

/* 卡面 */
.face{position:absolute;inset:0;border-radius:14px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;container-type:inline-size;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.09)}
.front{background:#1c1140}
.back{transform:rotateY(180deg);background:rgb(var(--back-bg,253,248,238));
  color:rgb(var(--back-text,59,50,38))}
.back::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(var(--back-line,110,92,66),.05) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(var(--back-line,110,92,66),.05) 0 1px,transparent 1px 3px)}

.art{display:block;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(20,8,30,.62) 0%,transparent 40%)}
.gloss{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
  background:radial-gradient(320px circle at var(--gx,50%) var(--gy,50%),
    rgba(255,255,255,.30),rgba(255,255,255,0) 62%)}
.caption{position:absolute;left:4.6cqw;bottom:4.6cqw;display:flex;align-items:center;gap:1.6cqw;
  padding:1.4cqw 2.8cqw;border-radius:999px;background:rgba(22,10,32,.40);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.22);color:#fff;font-size:2.1cqw;letter-spacing:.08em;
  text-shadow:0 1px 6px rgba(0,0,0,.55);white-space:nowrap}
.caption i{width:1.3cqw;height:1.3cqw;border-radius:50%;background:#ffd98a;
  box-shadow:0 0 10px 2px rgba(255,217,138,.85);flex-shrink:0}

/* 背面只读文字 */
.msg{position:absolute;left:6cqw;top:6.5cqw;bottom:6.5cqw;width:51cqw;padding:.4cqw .6cqw;
  color:inherit;font-size:3cqw;line-height:1.95;font-family:var(--font-msg);
  letter-spacing:.02em;white-space:pre-wrap;overflow:hidden;pointer-events:none}

.divider{position:absolute;top:6.5cqw;bottom:6.5cqw;left:61cqw;width:1px;
  background:linear-gradient(to bottom,transparent,
    rgba(var(--back-line,110,92,66),.30) 12%,
    rgba(var(--back-line,110,92,66),.30) 88%,transparent)}
.right{position:absolute;left:65cqw;top:6.5cqw;bottom:6.5cqw;width:29cqw;
  display:flex;flex-direction:column}

.stamp-row{position:relative;height:14.5cqw}
.stamp{position:absolute;right:0;top:0;width:11cqw;aspect-ratio:60/72;padding:1.3cqw;
  background:#fff;border:1px dashed rgba(var(--back-line,110,92,66),.5);border-radius:2px;
  box-shadow:0 3px 9px rgba(80,60,30,.16);overflow:hidden;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.stamp:hover{transform:rotate(-4deg) scale(1.07)}
.stamp img,.stamp svg{display:block;width:100%;height:100%;object-fit:cover}

.postmark{position:absolute;left:-1.5cqw;top:-1.5cqw;width:15cqw;height:15cqw;opacity:.6;
  transform:rotate(-14deg);pointer-events:none}
.postmark circle,.postmark line{stroke:rgb(var(--back-line,110,92,66))}
.postmark text{fill:rgb(var(--back-line,110,92,66))}

.addr{margin-top:3.2cqw;display:flex;flex-direction:column;gap:1.8cqw}
.addr-row{display:flex;align-items:flex-end;gap:1cqw;min-height:4.4cqw;padding-bottom:.6cqw;
  border-bottom:1px solid rgba(var(--back-line,110,92,66),.30)}
.addr-row.short{width:62%}
.addr-label{flex-shrink:0;font-family:var(--font-addr);font-size:1.9cqw;line-height:1;
  letter-spacing:.14em;color:rgba(var(--back-line,110,92,66),.75);padding-bottom:.2cqw}
.addr-text{flex:1;min-width:0;font-family:var(--font-addr);font-size:2.1cqw;
  line-height:1.25;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr-text i{font-style:normal;color:rgba(var(--back-line,110,92,66),.35)}

/* 提示 & 进度 */
.hint,.progress{position:fixed;left:50%;z-index:5;transform:translateX(-50%);pointer-events:none}
.hint{bottom:4.5vh;padding:10px 24px;border-radius:999px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:rgba(255,255,255,.62);font-size:13px;letter-spacing:.18em;white-space:nowrap;
  opacity:0;transition:opacity .8s ease}
.progress{bottom:11.5vh;width:min(50vw,260px);height:2px;border-radius:2px;
  background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .4s ease}
.progress.show{opacity:1}
.progress i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#ffb45f,#ff7f6a)}

@media (max-width:768px),(pointer:coarse){
  .bg{filter:blur(5px);transform:scale(1.06)}
  .card-rise{perspective:1150px}
  .flip{width:min(90vw,560px)}
  .hint{font-size:11px;letter-spacing:.1em;padding:8px 16px;bottom:5vh}
  .progress{bottom:12vh}
  .stamp:hover{transform:none}
}
</style>
</head>

<script>
(function(){
'use strict';

const CFG = Object.assign({
  title:'', fontFiles:[], fonts:{}, intro:{lines:[]}, images:{}, postmark:{},
  front:{}, back:{color:{}}, hint:'', tuning:{}
}, window.POSTCARD_CONFIG || {});

const T = Object.assign({
  maxTilt:13, wheelSens:0.38, introSens:0.0013, flipMax:180, lerp:0.10,
  backTrip:260, touchSens:0.9
}, CFG.tuning);

const $ = id => document.getElementById(id);
const root = document.documentElement;
const bgEl=$('bg'), vigEl=$('vig'), introEl=$('intro'),
      riseEl=$('rise'), tiltEl=$('tilt'), flipEl=$('flip'),
      hintEl=$('hint'), pbarWrap=$('pbar'), pbar=$('pbarI');

const clamp = (v,a,b) => v<a?a:v>b?b:v;
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function hex2rgb(hex){
  let h = String(hex).replace('#','').trim();
  if (h.length===3) h = h.split('').map(c=>c+c).join('');
  if (h.length!==6) return null;
  const n = parseInt(h,16);
  if (isNaN(n)) return null;
  return ((n>>16)&255)+', '+((n>>8)&255)+', '+(n&255);
}

function setImage(container, url, className){
  if (!url) return;
  const img = new Image();
  img.alt=''; img.decoding='async';
  if (className) img.className = className;
  img.onload = () => {
    const apply = () => {
      container.querySelectorAll('svg, img').forEach(n=>n.remove());
      container.insertBefore(img, container.firstChild);
    };
    img.decode ? img.decode().then(apply, apply) : apply();
  };
  img.onerror = () => console.warn('[postcard] 图片加载失败:', url);
  img.src = url;
}

/* 本地字体注入 */
function injectFonts(list){
  if (!list || !list.length) return;
  const css = list.map(f => {
    if (!f.family || !f.url) return '';
    const fmt = f.format ? ` format("${f.format}")` : '';
    return `@font-face{font-family:"${f.family}";src:url("${f.url}")${fmt};` +
      `font-weight:${f.weight||'400'};font-style:${f.style||'normal'};` +
      `font-display:${f.display||'swap'}}`;
  }).filter(Boolean).join('\n');
  if (!css) return;
  const tag = document.createElement('style');
  tag.textContent = css;
  document.head.appendChild(tag);
}

/* ---------- 应用配置 ---------- */
(function applyConfig(){
  injectFonts(CFG.fontFiles);
  if (CFG.title) document.title = CFG.title;

  const f = CFG.fonts || {};
  if (f.intro)    root.style.setProperty('--font-intro', f.intro);
  if (f.message)  root.style.setProperty('--font-msg',   f.message);
  if (f.caption)  root.style.setProperty('--font-cap',   f.caption);
  if (f.address)  root.style.setProperty('--font-addr',  f.address);
  if (f.postmark) root.style.setProperty('--font-pm',    f.postmark);

  const lines = introEl.querySelectorAll('p');
  (CFG.intro.lines || []).forEach((t,i)=>{ if (lines[i]) lines[i].textContent = t; });
  const cue = introEl.querySelector('.cue');
  if (cue) cue.textContent = CFG.intro.scrollCue || '';

  const cap = $('frontCap');
  if (cap) cap.textContent = (CFG.front||{}).caption || '';

  const p1 = $('pm1'), p2 = $('pm2');
  if (p1) p1.textContent = (CFG.postmark||{}).line1 || '';
  if (p2) p2.textContent = (CFG.postmark||{}).line2 || '';

  const msg = $('msg');
  if (msg) msg.textContent = (CFG.back||{}).message || '';

  const bc = (CFG.back||{}).color || {};
  const bg = hex2rgb(bc.bg), txt = hex2rgb(bc.text), line = hex2rgb(bc.line);
  if (bg)   root.style.setProperty('--back-bg',   bg);
  if (txt)  root.style.setProperty('--back-text', txt);
  if (line) root.style.setProperty('--back-line', line);

  const addr = $('addr');
  if (addr) {
    const list = (CFG.back||{}).addressLines || [];
    const last = list.length - 1;
    const label = (CFG.back||{}).toLabel || 'TO';
    addr.innerHTML = list.map((it,i)=>{
      const cls = 'addr-row' + (i===last ? ' short' : '');
      const lb  = i===0 ? `<span class="addr-label">${esc(label)}</span>` : '';
      const v   = esc(it.text || '');
      const ph  = esc(it.ph || '');
      const inner = v || (ph ? `<i>${ph}</i>` : '');
      return `<div class="${cls}">${lb}<span class="addr-text">${inner}</span></div>`;
    }).join('');
  }

  if (hintEl) hintEl.textContent = CFG.hint || '';

  const im = CFG.images || {};
  setImage(bgEl, im.background, '');
  setImage($('frontFace'), im.front, 'art');
  setImage($('stamp'), im.stamp, '');
})();

/* ---------- 状态 ---------- */
let introT=0, introC=0;
let tTX=0, tTY=0, tCX=0, tCY=0;
let angT=0, angC=0;
let rafId=null, hintGone=false, hintTimer=null;
let rectCache=null;
let viewH=innerHeight, viewW=innerWidth;
let backBuffer=0;

/* ---------- 主循环 ---------- */
function kick(){ if (rafId===null) rafId = requestAnimationFrame(frame); }

function frame(){
  rafId = null;

  introC += (introT - introC) * T.lerp;
  tCX    += (tTX    - tCX)    * T.lerp;
  tCY    += (tTY    - tCY)    * T.lerp;
  angC   += (angT   - angC)   * T.lerp;

  const io = smooth(0, .4, introC);
  introEl.style.opacity = (1 - io).toFixed(3);
  introEl.style.transform = 'translate3d(0,' + (-io*140).toFixed(1) + 'px,0)';

  bgEl.style.opacity  = smooth(.08,.58,introC).toFixed(3);
  vigEl.style.opacity = smooth(.22,.72,introC).toFixed(3);

  const rise = smooth(.22,1,introC);
  riseEl.style.transform = 'translate3d(0,' + ((1-rise)*viewH*.62).toFixed(1) + 'px,0)';
  riseEl.style.opacity   = smooth(.40,.88,introC).toFixed(3);

  tiltEl.style.transform = 'rotateX(' + tCX.toFixed(2) + 'deg) rotateY(' + tCY.toFixed(2) + 'deg)';
  flipEl.style.transform = 'rotateY(' + angC.toFixed(2) + 'deg)';

  const pct = angC / T.flipMax * 100;
  pbar.style.width = pct.toFixed(1) + '%';
  pbarWrap.classList.toggle('show', introC>.96 && pct>1 && pct<99);

  if (!hintGone) hintEl.style.opacity = smooth(.94,1,introC).toFixed(3);

  if (Math.abs(introT-introC)>0.0005 ||
      Math.abs(tTX-tCX)>0.008 ||
      Math.abs(tTY-tCY)>0.008 ||
      Math.abs(angT-angC)>0.008) {
    kick();
  } else {
    introC=introT; tCX=tTX; tCY=tTY; angC=angT;
  }
}

function dismissHint(){
  if (hintGone) return;
  hintGone = true;
  hintEl.style.opacity = '0';
}

function pushIntro(v){
  const prev = introT;
  introT = clamp(v, 0, 1);
  if (prev<1 && introT>=1 && !hintTimer && !hintGone) {
    hintTimer = setTimeout(dismissHint, 9000);
    rectCache = null;
  }
  kick();
}

/* ---------- 统一滚动处理（滚轮 & 触摸共用） ---------- */
function handleScroll(d){
  if (!d) return;

  if (introT < 1) { pushIntro(introT + d*T.introSens); return; }

  const prev = angT;
  angT = clamp(angT + d*T.wheelSens, 0, T.flipMax);

  if (Math.abs(angT - prev) > 0.01) {
    dismissHint(); rectCache = null; backBuffer = 0;
    kick(); return;
  }

  if (angT <= 0.01 && d < 0) {
    backBuffer += -d;
    if (backBuffer >= T.backTrip) {
      backBuffer -= T.backTrip;
      pushIntro(introT + d*T.introSens);
    }
  } else {
    backBuffer = 0;
  }
  kick();
}

/* ---------- 滚轮 ---------- */
addEventListener('wheel', e => {
  e.preventDefault();
  let d = e.deltaY;
  if (e.deltaMode === 1) d *= 16;
  else if (e.deltaMode === 2) d *= 100;
  handleScroll(d);
}, { passive:false });

/* ---------- 触摸 ---------- */
let touchLastY = 0, touchActive = false;
addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { touchActive = false; return; }
  touchActive = true;
  touchLastY = e.touches[0].clientY;
}, { passive:true });

addEventListener('touchmove', e => {
  if (!touchActive || e.touches.length !== 1) return;
  const y = e.touches[0].clientY;
  const dy = touchLastY - y;
  touchLastY = y;
  if (Math.abs(dy) < 0.5) return;
  handleScroll(dy * T.touchSens);
  if (e.cancelable) e.preventDefault();
}, { passive:false });

addEventListener('touchend',    () => { touchActive = false; }, { passive:true });
addEventListener('touchcancel', () => { touchActive = false; }, { passive:true });

/* ---------- 鼠标倾斜 + 高光 ---------- */
let pPend = false, pX = 0, pY = 0;
addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  pX = e.clientX; pY = e.clientY;
  if (pPend) return;
  pPend = true;
  requestAnimationFrame(() => {
    pPend = false;
    const nx = (pX/viewW - .5) * 2;
    const ny = (pY/viewH - .5) * 2;
    tTY =  clamp(nx,-1,1) * T.maxTilt;
    tTX = -clamp(ny,-1,1) * T.maxTilt;

    if (!rectCache) {
      const r = flipEl.getBoundingClientRect();
      if (r.width) rectCache = { l:r.left, t:r.top, w:r.width, h:r.height };
    }
    if (rectCache && rectCache.w) {
      root.style.setProperty('--gx', ((pX-rectCache.l)/rectCache.w*100).toFixed(1) + '%');
      root.style.setProperty('--gy', ((pY-rectCache.t)/rectCache.h*100).toFixed(1) + '%');
    }
    kick();
  });
}, { passive:true });

addEventListener('pointerleave', () => { tTX = tTY = 0; kick(); });

/* ---------- 空格键翻面 ---------- */
addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (introT < 1) return;
  angT = angT >= T.flipMax/2 ? 0 : T.flipMax;
  dismissHint(); rectCache = null; backBuffer = 0; kick();
});

/* ---------- 尺寸变化 ---------- */
function onResize(){
  viewH = innerHeight; viewW = innerWidth;
  rectCache = null; tTX = tTY = 0;
  kick();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 200));

kick();
})();
</script>
</body>
